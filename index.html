<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ドリンク販売設定画面</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
    <script src="./firebase.js"></script>

    <style>
        /* 全体の背景：空のような明るい水色から薄い黄色へのグラデーション */
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #fff9c4, #b3e5fc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-sizing: border-box;
        }

        /* コンテナ：角丸で、おもちゃ箱のような温かい雰囲気 */
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 35px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 100%;
            max-width: 500px;
            border: 6px solid #ffeb3b;
            /* 明るい黄色の縁取り */
        }

        h1 {
            color: #f57c00;
            font-size: 32px;
            margin: 5px 0;
            text-shadow: 1px 1px #fff;
        }

        /* 楽しいボタン：クリックしたくなる立体感 */
        .btn {
            cursor: pointer;
            border: none;
            font-weight: bold;
            border-radius: 50px;
            padding: 20px;
            width: 100%;
            font-size: 24px;
            color: white;
            box-shadow: 0 8px #d84315;
            transition: transform 0.1s;
        }

        #saveBtn {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            font-size: 20px;
            background: #4CAF50;
            box-shadow: 0 6px #2E7D32;
        }

        #saveBtn:active {
            transform: translateY(3px);
            box-shadow: 0 3px #2E7D32;
        }

        /* チェックリスト：水色ベースで整理されたデザイン */
        .checkbox-list {
            text-align: left;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
            background: #e1f5fe;
            padding: 15px;
            border-radius: 25px;
            border: 3px solid #b3e5fc;
        }

        /* チェックリスト：設定 */
        .checkbox-setting {
            text-align: left;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            background: #e1f5fe;
            padding: 15px;
            border-radius: 25px;
            border: 3px solid #b3e5fc;
        }

        .item-label {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: #ffffff;
            border-radius: 15px;
            cursor: pointer;
            font-size: 18px;
            color: #0277bd;
            font-weight: bold;
        }

        .item-label input {
            accent-color: #03a9f4;
            transform: scale(1.6);
            margin-right: 15px;
        }


        .section-title {
            text-align: left;
            font-size: 32px;
            color: #555;
            margin: 20px 0 10px;
        }

        .title-divider {
            border: 0;
            height: 3px;
            background: linear-gradient(to right, #81D4FA, #4FC3F7, #81D4FA);
            border-radius: 3px;
            margin: 20px 0 25px;
        }

        /* ローディング画面 */
        #loading {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.7);
            z-index: 9999;

            justify-content: center;
            align-items: center;
        }

        /* クルクル */
        .spinner {
            width: 70px;
            height: 70px;
            border: 8px solid #E3F2FD;
            border-top: 8px solid #2196F3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #reloadBtn {
            margin-top: 18px;
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            background: #2196F3;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #1565C0;
        }

        #reloadBtn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #1565C0;
        }
        #counterTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 18px;
        }

        #counterTable th {
            background: #2196F3;
            color: white;
            padding: 10px;
        }

        #counterTable td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        #counterTable tbody tr:nth-child(even) {
            background: #f7f7f7;
        }

        #counterTable tfoot {
            background: #FFF3CD;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>
<div id="loading">
    <div class="spinner"></div>
</div>

<body>
    <div class="container">
        <br />
        <label style="font-weight: bold; color: #555; cursor: pointer; font-size: 32px;">
            横浜南陵高校
            <br />
            ドリンク販売設定画面
        </label>
        <button id="reloadBtn" type="button" onclick="location.reload();">↻ リロード</button>

        <table id="counterTable">
            <thead>
                <tr>
                    <th>日付</th>
                    <th>当たり</th>
                    <th>おまけ</th>
                    <th>合計</th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <th>総合計</th>
                    <th id="totalOoatari">0</th>
                    <th id="totalOmake">0</th>
                    <th id="grandTotal">0</th>
                </tr>
            </tfoot>
        </table>
    </div>

</body>
<script>
    $(function () {

        loadCounter();

    });
</script>

</html>
